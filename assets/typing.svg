<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 145" width="100%" height="145" fill="none">
  <defs>
    <!-- Background & Glass Gradients -->
    <linearGradient id="term-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#050814" />
      <stop offset="100%" stop-color="#02040a" />
    </linearGradient>
    <linearGradient id="term-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="40%" stop-color="#818cf8" stop-opacity="0.25" />
      <stop offset="80%" stop-color="#34d399" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01" />
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes cursor-blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes line1 {
      0%, 22% { opacity: 1; transform: translateY(0); }
      24%, 100% { opacity: 0; transform: translateY(-3px); }
    }
    @keyframes line2 {
      0%, 24% { opacity: 0; transform: translateY(3px); }
      26%, 48% { opacity: 1; transform: translateY(0); }
      50%, 100% { opacity: 0; transform: translateY(-3px); }
    }
    @keyframes line3 {
      0%, 49% { opacity: 0; transform: translateY(3px); }
      51%, 73% { opacity: 1; transform: translateY(0); }
      75%, 100% { opacity: 0; transform: translateY(-3px); }
    }
    @keyframes line4 {
      0%, 74% { opacity: 0; transform: translateY(3px); }
      76%, 98% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-3px); }
    }
    @keyframes cursor-glide {
      0%, 23% { transform: translateX(410px); }
      26%, 49% { transform: translateX(455px); }
      51%, 74% { transform: translateX(430px); }
      76%, 99% { transform: translateX(445px); }
    }

    .card-shell {
      stroke: url(#term-border);
      stroke-width: 1.5;
      rx: 14px;
      fill: url(#term-bg);
    }
    .term-title {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Mono', 'Fira Code', monospace;
      font-size: 11px;
      font-weight: 500;
      fill: #64748b;
      letter-spacing: 0.5px;
    }
    .mono {
      font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', Consolas, monospace;
    }
    .user { fill: #38bdf8; font-weight: 700; }
    .host { fill: #818cf8; }
    .path { fill: #34d399; font-weight: 600; }
    .symbol { fill: #f43f5e; font-weight: bold; }
    
    .type-line {
      font-size: 15px;
      font-weight: 600;
      fill: #f8fafc;
      letter-spacing: 0.2px;
      filter: url(#neon-glow);
    }
    .cursor {
      fill: #38bdf8;
      animation: cursor-blink 0.8s infinite;
    }
    .l1 { animation: line1 14s ease-in-out infinite; }
    .l2 { animation: line2 14s ease-in-out infinite; }
    .l3 { animation: line3 14s ease-in-out infinite; }
    .l4 { animation: line4 14s ease-in-out infinite; }
    .cursor-anim { animation: cursor-glide 14s ease-in-out infinite; }
  </style>

  <!-- Base Shell -->
  <rect x="2" y="2" width="846" height="141" class="card-shell" />
  <rect x="2" y="2" width="846" height="34" rx="14" fill="#0d1527" opacity="0.9" />
  <rect x="2" y="2" width="846" height="65" rx="14" fill="url(#sheen)" />

  <!-- Mac Traffic Lights -->
  <circle cx="24" cy="18" r="5" fill="#ef4444" />
  <circle cx="42" cy="18" r="5" fill="#f59e0b" />
  <circle cx="60" cy="18" r="5" fill="#10b981" />
  
  <text x="425" y="22" text-anchor="middle" class="term-title">limbot3@devbox &bull; zsh &bull; ~ (interactive)</text>

  <!-- Prompt Command Line -->
  <g transform="translate(26, 68)" class="mono">
    <text font-size="14.5">
      <tspan class="user">limbot3</tspan><tspan class="host">@core</tspan> <tspan class="path">~/workspace</tspan> <tspan class="symbol">❯</tspan> 
      <tspan fill="#e2e8f0" font-weight="500">profile --get-focus --verbose</tspan>
    </text>
  </g>

  <!-- Dynamic Animated Response -->
  <g transform="translate(26, 110)" class="mono">
    <text font-size="14" fill="#38bdf8" font-weight="bold">➜</text>
    <text font-size="13" fill="#64748b" x="18" y="-1">focus:</text>

    <g transform="translate(75, 0)">
      <text class="type-line l1" y="0">⚡ Fullstack Architect &bull; React, Next.js, Node &amp; Go</text>
      <text class="type-line l2" y="0">🤖 Artificial Intelligence &bull; LLM Workflows, PyTorch &amp; Vision</text>
      <text class="type-line l3" y="0">☁️ Cloud &amp; DevOps &bull; Docker, K8s, CI/CD &amp; Automation</text>
      <text class="type-line l4" y="0">📱 Mobile &amp; Scalable Systems &bull; Flutter, Dart &amp; Clean Architecture</text>

      <!-- Blinking Neon Cursor -->
      <g class="cursor-anim">
        <rect x="0" y="-14" width="8.5" height="17" rx="2" class="cursor" />
      </g>
    </g>
  </g>
</svg>