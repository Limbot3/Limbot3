<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 130" width="100%" height="130" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes line1 {
      0%, 23% { opacity: 1; }
      25%, 100% { opacity: 0; }
    }
    @keyframes line2 {
      0%, 24% { opacity: 0; }
      26%, 48% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes line3 {
      0%, 49% { opacity: 0; }
      51%, 73% { opacity: 1; }
      75%, 100% { opacity: 0; }
    }
    @keyframes line4 {
      0%, 74% { opacity: 0; }
      76%, 98% { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes cursor-move {
      0%, 25% { transform: translateX(330px); }
      26%, 50% { transform: translateX(385px); }
      51%, 75% { transform: translateX(360px); }
      76%, 100% { transform: translateX(410px); }
    }

    .term-window {
      stroke: url(#border-grad);
      stroke-width: 1.5;
      rx: 12px;
      fill: url(#bg-grad);
    }
    .term-header {
      fill: #1e293b;
    }
    .term-text {
      font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace;
      font-size: 15px;
      fill: #94a3b8;
    }
    .user { fill: #38bdf8; font-weight: bold; }
    .host { fill: #818cf8; }
    .prompt { fill: #34d399; font-weight: bold; }
    .typing-text {
      font-family: 'Fira Code', 'JetBrains Mono', monospace;
      font-size: 16px;
      font-weight: 600;
      fill: #f8fafc;
      filter: url(#glow);
    }
    .cursor {
      fill: #38bdf8;
      animation: blink 0.8s infinite;
    }
    .line-1 { animation: line1 12s infinite; }
    .line-2 { animation: line2 12s infinite; }
    .line-3 { animation: line3 12s infinite; }
    .line-4 { animation: line4 12s infinite; }
    .cursor-group { animation: cursor-move 12s infinite; }
  </style>

  <!-- Terminal Frame -->
  <rect x="2" y="2" width="796" height="126" class="term-window" />
  <path d="M 2 14 C 2 7.37 7.37 2 14 2 L 786 2 C 792.63 2 798 7.37 798 14 L 798 32 L 2 32 Z" class="term-header" />

  <!-- Window Dots -->
  <circle cx="22" cy="17" r="5.5" fill="#ef4444" />
  <circle cx="40" cy="17" r="5.5" fill="#f59e0b" />
  <circle cx="58" cy="17" r="5.5" fill="#10b981" />
  <text x="400" y="21" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11" fill="#64748b">limbot3@macbook-pro:~ (zsh)</text>

  <!-- Prompt Command -->
  <g transform="translate(24, 60)">
    <text class="term-text">
      <tspan class="user">limbot3</tspan><tspan class="host">@github</tspan><tspan class="term-text">:</tspan><tspan class="prompt">~</tspan><tspan class="term-text">$ </tspan>
      <tspan fill="#e2e8f0">whoami --focus --interactive</tspan>
    </text>
  </g>

  <!-- Cycling Output -->
  <g transform="translate(24, 98)">
    <text class="term-text">
      <tspan fill="#64748b">&gt;&gt; </tspan>
    </text>
    
    <g transform="translate(35, 0)">
      <text class="typing-text line-1" y="0">⚡ Fullstack &amp; Mobile Engineer</text>
      <text class="typing-text line-2" y="0">🤖 Data &amp; Artificial Intelligence Explorer</text>
      <text class="typing-text line-3" y="0">☁️ DevOps &amp; Cloud Platform Builder</text>
      <text class="typing-text line-4" y="0">🚀 Designing Scalable &amp; Interactive Apps</text>

      <!-- Dynamic Blinking Cursor -->
      <g class="cursor-group">
        <rect x="0" y="-14" width="9" height="18" rx="2" class="cursor" />
      </g>
    </g>
  </g>
</svg>