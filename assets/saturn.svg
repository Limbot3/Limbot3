<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 200" width="100%" height="200" fill="none">
  <defs>
    <!-- Chromatic Planet Sphere Gradient -->
    <linearGradient id="planet-grad" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="25%" stop-color="#f43f5e" />
      <stop offset="55%" stop-color="#818cf8" />
      <stop offset="85%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- Planet Shadow Gradient -->
    <radialGradient id="planet-shadow" cx="65%" cy="65%" r="65%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0" />
      <stop offset="70%" stop-color="#02040a" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#02040a" stop-opacity="0.9" />
    </radialGradient>

    <!-- Chromatic Rings Gradient -->
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#f43f5e" stop-opacity="0.95" />
      <stop offset="65%" stop-color="#00f0ff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.8" />
    </linearGradient>

    <!-- Ring Shading Mask -->
    <filter id="planet-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow Behind Planet -->
  <circle cx="110" cy="100" r="56" fill="#f43f5e" opacity="0.25" filter="url(#planet-glow)" />
  <circle cx="110" cy="100" r="48" fill="#00f0ff" opacity="0.2" filter="url(#planet-glow)" />

  <!-- Back Portion of Saturn Rings -->
  <g transform="translate(110, 100) rotate(-24)">
    <ellipse cx="0" cy="0" rx="92" ry="24" fill="none" stroke="url(#ring-grad)" stroke-width="12" opacity="0.45" />
    <ellipse cx="0" cy="0" rx="96" ry="26" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.6" />
    <ellipse cx="0" cy="0" rx="84" ry="20" fill="none" stroke="url(#ring-grad)" stroke-width="5" opacity="0.7" />
  </g>

  <!-- Planet Sphere Body -->
  <circle cx="110" cy="100" r="44" fill="url(#planet-grad)" />
  <circle cx="110" cy="100" r="44" fill="url(#planet-shadow)" />

  <!-- Planet Atmospheric Edge Sheen -->
  <circle cx="110" cy="100" r="43.5" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.35" />

  <!-- Front Portion of Saturn Rings (Clipped/Drawn in front of planet) -->
  <g transform="translate(110, 100) rotate(-24)">
    <path d="M -92 0 A 92 24 0 0 0 92 0" fill="none" stroke="url(#ring-grad)" stroke-width="12" opacity="0.95" />
    <path d="M -96 0 A 96 26 0 0 0 96 0" fill="none" stroke="#ffffff" stroke-width="1.8" opacity="0.8" />
    <path d="M -84 0 A 84 20 0 0 0 84 0" fill="none" stroke="#fbbf24" stroke-width="4" opacity="0.9" />
  </g>

  <!-- Tiny Cosmic Sparkles -->
  <circle cx="36" cy="62" r="1.5" fill="#ffffff" opacity="0.8" />
  <circle cx="180" cy="148" r="2" fill="#00f0ff" opacity="0.9" />
  <circle cx="165" cy="42" r="1.2" fill="#fbbf24" opacity="0.7" />
</svg>