<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 220" width="100%" height="220" fill="none">
  <defs>
    <!-- Aurion Obsidian & Ice Cyan Planet Sphere -->
    <linearGradient id="aurion-sphere-grad" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="25%" stop-color="#38bdf8" />
      <stop offset="55%" stop-color="#0284c7" />
      <stop offset="85%" stop-color="#03204a" />
      <stop offset="100%" stop-color="#020611" />
    </linearGradient>

    <!-- Deep Shadow Gradient -->
    <radialGradient id="aurion-sphere-shadow" cx="68%" cy="68%" r="65%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0" />
      <stop offset="65%" stop-color="#020611" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#020611" stop-opacity="0.95" />
    </radialGradient>

    <!-- Ice Cyan Rings Gradient -->
    <linearGradient id="aurion-ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#7dd3fc" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.5" />
    </linearGradient>

    <!-- Soft Ethereal Glow Filter -->
    <filter id="aurion-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="ring-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>

  <!-- Ambient Blue Atmosphere Behind Planet -->
  <circle cx="140" cy="110" r="64" fill="#0284c7" opacity="0.35" filter="url(#aurion-glow)" />
  <circle cx="140" cy="110" r="52" fill="#38bdf8" opacity="0.3" filter="url(#aurion-glow)" />

  <!-- Back Portion of Rings -->
  <g transform="translate(140, 110) rotate(-22)">
    <ellipse cx="0" cy="0" rx="108" ry="28" fill="none" stroke="url(#aurion-ring-grad)" stroke-width="14" opacity="0.4" />
    <ellipse cx="0" cy="0" rx="114" ry="30" fill="none" stroke="#ffffff" stroke-width="1.6" opacity="0.6" />
    <ellipse cx="0" cy="0" rx="98" ry="24" fill="none" stroke="#38bdf8" stroke-width="6" opacity="0.7" />
  </g>

  <!-- Planet Sphere Body -->
  <circle cx="140" cy="110" r="50" fill="url(#aurion-sphere-grad)" />
  <circle cx="140" cy="110" r="50" fill="url(#aurion-sphere-shadow)" />

  <!-- Outer Glass Atmospheric Edge Sheen -->
  <circle cx="140" cy="110" r="49.5" fill="none" stroke="#a5f3fc" stroke-width="1.2" opacity="0.5" />

  <!-- Inner Glowing Aperture (Like the Aurion circular logo) -->
  <circle cx="132" cy="102" r="14" fill="#020611" opacity="0.7" />
  <circle cx="132" cy="102" r="12" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.8" />
  <circle cx="132" cy="102" r="5" fill="#ffffff" opacity="0.9" />

  <!-- Front Portion of Rings (Drawn in front of planet) -->
  <g transform="translate(140, 110) rotate(-22)">
    <path d="M -108 0 A 108 28 0 0 0 108 0" fill="none" stroke="url(#aurion-ring-grad)" stroke-width="14" opacity="0.95" />
    <path d="M -114 0 A 114 30 0 0 0 114 0" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.9" />
    <path d="M -98 0 A 98 24 0 0 0 98 0" fill="none" stroke="#38bdf8" stroke-width="5" opacity="0.95" />
  </g>

  <!-- Distant Cyan Sparkles -->
  <circle cx="48" cy="68" r="1.8" fill="#ffffff" opacity="0.9" />
  <circle cx="230" cy="158" r="2.2" fill="#38bdf8" opacity="0.95" />
  <circle cx="215" cy="48" r="1.5" fill="#a5f3fc" opacity="0.8" />
</svg>