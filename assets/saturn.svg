<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 220" width="100%" height="220" fill="none">
  <defs>
    <!-- Chromatic Planet Sphere Gradient -->
    <linearGradient id="planet-grad" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="25%" stop-color="#f43f5e" />
      <stop offset="55%" stop-color="#818cf8" />
      <stop offset="85%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- Planet Shadow Gradient -->
    <radialGradient id="planet-shadow" cx="65%" cy="65%" r="65%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0" />
      <stop offset="70%" stop-color="#02040a" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#02040a" stop-opacity="0.9" />
    </radialGradient>

    <!-- Chromatic Rings Gradient -->
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.85" />
      <stop offset="30%" stop-color="#f43f5e" stop-opacity="0.95" />
      <stop offset="65%" stop-color="#00f0ff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.85" />
    </linearGradient>

    <filter id="planet-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow Behind Planet -->
  <circle cx="140" cy="110" r="64" fill="#f43f5e" opacity="0.25" filter="url(#planet-glow)" />
  <circle cx="140" cy="110" r="54" fill="#00f0ff" opacity="0.2" filter="url(#planet-glow)" />

  <!-- Back Portion of Saturn Rings -->
  <g transform="translate(140, 110) rotate(-22)">
    <ellipse cx="0" cy="0" rx="108" ry="28" fill="none" stroke="url(#ring-grad)" stroke-width="14" opacity="0.45" />
    <ellipse cx="0" cy="0" rx="113" ry="30" fill="none" stroke="#ffffff" stroke-width="1.8" opacity="0.65" />
    <ellipse cx="0" cy="0" rx="98" ry="24" fill="none" stroke="url(#ring-grad)" stroke-width="6" opacity="0.75" />
  </g>

  <!-- Planet Sphere Body -->
  <circle cx="140" cy="110" r="50" fill="url(#planet-grad)" />
  <circle cx="140" cy="110" r="50" fill="url(#planet-shadow)" />

  <!-- Planet Atmospheric Edge Sheen -->
  <circle cx="140" cy="110" r="49.5" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.4" />

  <!-- Front Portion of Saturn Rings (Drawn in front of planet) -->
  <g transform="translate(140, 110) rotate(-22)">
    <path d="M -108 0 A 108 28 0 0 0 108 0" fill="none" stroke="url(#ring-grad)" stroke-width="14" opacity="0.95" />
    <path d="M -113 0 A 113 30 0 0 0 113 0" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.85" />
    <path d="M -98 0 A 98 24 0 0 0 98 0" fill="none" stroke="#fbbf24" stroke-width="5" opacity="0.95" />
  </g>

  <!-- Tiny Cosmic Sparkles -->
  <circle cx="48" cy="68" r="1.8" fill="#ffffff" opacity="0.85" />
  <circle cx="230" cy="158" r="2.2" fill="#00f0ff" opacity="0.9" />
  <circle cx="215" cy="48" r="1.5" fill="#fbbf24" opacity="0.75" />
</svg>