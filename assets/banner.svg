<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="280" fill="none">
  <defs>
    <!-- Deep Obsidian Canvas -->
    <linearGradient id="aurion-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020611" />
      <stop offset="50%" stop-color="#050c1e" />
      <stop offset="100%" stop-color="#020611" />
    </linearGradient>

    <!-- Aurion Ethereal Cyan & Ice Blue Flares -->
    <radialGradient id="aurion-beam-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="15%" stop-color="#a5f3fc" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="65%" stop-color="#0284c7" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="aurion-ambient-left" cx="0%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.75" />
      <stop offset="40%" stop-color="#0369a1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#020611" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="aurion-ambient-right" cx="100%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.75" />
      <stop offset="40%" stop-color="#0369a1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#020611" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="horizontal-waist" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="75%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>

    <!-- Gaussian Blurs for Silky Aurora Glow -->
    <filter id="aurora-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="32" result="blur" />
    </filter>

    <filter id="waist-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" />
    </filter>

    <filter id="core-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
  </defs>

  <!-- Base Obsidian Canvas -->
  <rect width="900" height="280" rx="14" fill="url(#aurion-bg)" />
  <rect width="900" height="280" rx="14" stroke="#1e293b" stroke-width="1.2" />

  <!-- Ambient Blue Halos on Sides (Hourglass Flare Structure) -->
  <ellipse cx="0" cy="140" rx="320" ry="180" fill="url(#aurion-ambient-left)" filter="url(#aurora-blur)" />
  <ellipse cx="900" cy="140" rx="320" ry="180" fill="url(#aurion-ambient-right)" filter="url(#aurora-blur)" />

  <!-- Central Ethereal Blue Waist Nebula -->
  <ellipse cx="450" cy="140" rx="420" ry="48" fill="url(#horizontal-waist)" filter="url(#aurora-blur)" opacity="0.85" />
  <ellipse cx="450" cy="140" rx="300" ry="24" fill="url(#horizontal-waist)" filter="url(#waist-blur)" opacity="0.95" />

  <!-- Top Curved Aurora Bow -->
  <path d="M 0 40 Q 450 140 900 40 L 900 0 L 0 0 Z" fill="#020611" opacity="0.7" />
  <path d="M -40 20 Q 450 150 940 20" fill="none" stroke="#38bdf8" stroke-width="28" opacity="0.55" filter="url(#aurora-blur)" />

  <!-- Bottom Curved Aurora Bow -->
  <path d="M 0 240 Q 450 140 900 240 L 900 280 L 0 280 Z" fill="#020611" opacity="0.7" />
  <path d="M -40 260 Q 450 130 940 260" fill="none" stroke="#38bdf8" stroke-width="28" opacity="0.55" filter="url(#aurora-blur)" />

  <!-- Brilliant Center Light Horizon Line -->
  <line x1="80" y1="140" x2="820" y2="140" stroke="url(#horizontal-waist)" stroke-width="3" filter="url(#core-glow)" opacity="0.95" />
  <line x1="200" y1="140" x2="700" y2="140" stroke="#ffffff" stroke-width="1.5" opacity="0.9" />

  <!-- Center Aperture Star Glow -->
  <circle cx="450" cy="140" r="28" fill="#38bdf8" opacity="0.4" filter="url(#core-glow)" />
  <circle cx="450" cy="140" r="10" fill="#ffffff" opacity="0.9" filter="url(#core-glow)" />
  <circle cx="450" cy="140" r="3.5" fill="#ffffff" />

  <!-- Modern Subtle Border Highlight -->
  <rect width="900" height="280" rx="14" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="1" />
</svg>