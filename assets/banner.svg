  <defs>
    <linearGradient id="bg-space" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02040a" />
      <stop offset="40%" stop-color="#060919" />
      <stop offset="80%" stop-color="#080d22" />
      <stop offset="100%" stop-color="#02040a" />
    </linearGradient>

    <linearGradient id="chroma-ribbon-1" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="20%" stop-color="#00f0ff" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#818cf8" stop-opacity="0.95" />
      <stop offset="65%" stop-color="#f43f5e" stop-opacity="0.95" />
      <stop offset="85%" stop-color="#fbbf24" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="chroma-ribbon-2" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#fbbf24" stop-opacity="0.85" />
      <stop offset="65%" stop-color="#00f0ff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.75" />
    </linearGradient>

    <linearGradient id="glow-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.65" />
      <stop offset="80%" stop-color="#818cf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </linearGradient>

    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="deep-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="30" />
    </filter>

    <filter id="flare-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" />
    </filter>
  </defs>

